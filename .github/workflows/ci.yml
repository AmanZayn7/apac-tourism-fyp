name: Verify forecasting and dashboard
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m stis.build_artifacts --check
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - name: Build and verify the Linux serving container
        run: |
          docker compose up --build -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8501/_stcore/health
          docker compose exec -T dashboard python - <<'PY'
          from streamlit.testing.v1 import AppTest
          from stis.config import CANDIDATES, CITIES
          app = AppTest.from_file('/app/streamlit_app.py', default_timeout=30).run()
          assert not app.exception
          for city in CITIES:
              app.sidebar.selectbox[0].select(city).run()
              for model in CANDIDATES:
                  app.sidebar.selectbox[1].select(model).run()
                  assert not app.exception, (city, model, app.exception)
                  assert len(app.dataframe[0].value) == 12
          print('PASS: all 21 destination/model combinations in the serving container')
          PY
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
  reproduce:
    name: Reproduce the published forecasts on macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: brew install libomp
      - run: python -m pip install -r requirements-notebooks.txt
      - run: python -m pip check
      - run: python -m stis.build_artifacts --check
      - run: python scripts/build_notebooks.py --execute
      - uses: actions/upload-artifact@v4
        with:
          name: executed-release-notebooks
          path: notebooks/*.ipynb
