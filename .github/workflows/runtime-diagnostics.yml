name: Diagnose runtime reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: python -m pip install -r requirements.txt
      - run: python scripts/diagnose_runtime.py --output diagnostics/runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.os }}
          path: diagnostics/runtime.json
