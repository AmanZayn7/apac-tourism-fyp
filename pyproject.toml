[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apac-tourism-observatory"
version = "2.0.0"
description = "Leakage-aware monthly tourism forecasting and an evidence-first Streamlit dashboard"
requires-python = ">=3.11,<3.14"
authors = [{name = "Abdul Muhaimin Aman"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
include = ["stis*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
